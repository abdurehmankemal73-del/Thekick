# Local development PostgreSQL only (not used by Coolify).
# npm run db:up
# DATABASE_URL=postgresql://thekick:thekick@localhost:5432/thekick
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thekick
      POSTGRES_PASSWORD: thekick
      POSTGRES_DB: thekick
    ports:
      - "5432:5432"
    volumes:
      - thekick_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thekick -d thekick"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  thekick_pg_dev:
